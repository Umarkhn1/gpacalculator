<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Масштаб страницы зафиксирован: без щипка и двойного тапа.
         iOS Safari игнорирует user-scalable=no, поэтому жест гасим и скриптом. -->
    <script>
      document.addEventListener('gesturestart', function (e) { e.preventDefault() })
      document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault() }, { passive: false })
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>GPA · статистика</title>
    <style>
      /* Палитра и типографика — те же, что в калькуляторе (src/styles.css). */
      :root {
        --bg: #eef3f8;
        --surface: #ffffff;
        --ink: #0c1225;
        --ink-soft: #5b6b7d;
        --line: #dbe4ec;
        --field: #f1f6fa;
        --primary: #3577d4;
        --primary-2: #5a9ae6;
        --primary-deep: #2a63bb;
        --green: #28a745;
        --amber: #d8971f;
        --red: #dc3545;
        --sans: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      /* Только прокрутка — щипок и двойной тап не увеличивают страницу. */
      html, body { touch-action: pan-x pan-y; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      /* Таблица широкая — страницу не ограничиваем, поля минимальные. */
      .page { max-width: none; margin: 0; padding: 24px 14px 44px; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand-logo { width: 46px; height: 46px; object-fit: contain; flex: none; }
      .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
      .brand-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(120deg, var(--primary), var(--primary-2));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brand-tag { font-size: 12.5px; color: var(--ink-soft); }
      .top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        color: var(--ink-soft);
      }
      .icon-btn:hover { color: var(--primary-deep); }

      button, input, select {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 14px;
      }
      button { cursor: pointer; font-weight: 600; font-size: 14px; }
      button:hover { border-color: var(--primary); color: var(--primary-deep); }
      .btn-accent {
        background: linear-gradient(120deg, var(--primary), var(--primary-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 10px 22px rgba(53, 119, 212, 0.25);
      }
      .btn-accent:hover { color: #fff; filter: brightness(1.04); }
      input:focus, select:focus { outline: 2px solid rgba(53, 119, 212, 0.35); outline-offset: 1px; }

      .tools {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }
      .tools input[type='search'] { flex: 1 1 240px; background: var(--field); }
      .tools select { background: var(--field); max-width: 220px; }
      .count { margin-left: auto; color: var(--ink-soft); font-size: 13.5px; white-space: nowrap; }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      .scroll { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      /* Ячейки переносятся, короткие колонки — нет: так таблица влезает без прокрутки. */
      th, td { text-align: left; padding: 9px 6px; vertical-align: top; overflow-wrap: anywhere; }
      td.nowrap, th.nowrap { white-space: nowrap; }
      td.wrap, th.wrap { max-width: 180px; }
      /* На телефоне колонкам тесно: таблица прокручивается вбок, а не рвёт слова по буквам. */
      @media (max-width: 900px) {
        th, td { overflow-wrap: normal; white-space: nowrap; }
        td.wrap, th.wrap { white-space: normal; min-width: 170px; }
      }
      thead th {
        position: sticky;
        top: 0;
        background: var(--surface);
        border-bottom: 2px solid var(--primary);
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0;
        color: var(--ink-soft);
        cursor: pointer;
        user-select: none;
      }
      thead th:hover { color: var(--primary-deep); }
      .arrow { display: inline-block; margin-left: 3px; font-size: 9px; opacity: 0.35; }
      th.sorted .arrow { opacity: 1; color: var(--primary); }
      tbody tr { border-top: 1px solid var(--line); }
      tbody tr:hover { background: var(--field); }
      td.dim { color: var(--ink-soft); }
      /* Ступени балла: 4.5+ отлично, 3.5+ хорошо, 2.6+ нормально, ниже 2.6 критично. */
      .gpa { font-weight: 700; }
      .g-high { color: #1f8a44; }
      .g-mid { color: var(--primary); }
      .g-norm { color: var(--amber); }
      .g-low { color: var(--red); }
      /* Сводка над таблицей: пересчитывается под поиск и фильтр. */
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
      .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
      .stat b { display: block; font-size: 26px; line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums; }
      .stat span { font-size: 12.5px; color: var(--ink-soft); }
      .approx { color: var(--amber); font-weight: 700; margin-right: 3px; }
      .legend { color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; }
      .mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 13px; }
      .empty { padding: 28px; text-align: center; color: var(--ink-soft); }

      .gate {
        max-width: 380px;
        margin: 14vh auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 26px 24px;
        text-align: center;
      }
      .gate h1 { font-size: 19px; margin: 0 0 6px; }
      .gate p { margin: 0 0 16px; color: var(--ink-soft); font-size: 13.5px; }
      .gate input { width: 100%; background: var(--field); text-align: center; letter-spacing: 0.08em; }
      .gate button { width: 100%; margin-top: 14px; }
      .err { color: #dc3545; font-size: 13.5px; min-height: 20px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="page" id="app"></div>
    <script>
      const API = '/api/s-165b0620afce'
      const KEY_STORE = 'gpa-stats-key'
      const app = document.getElementById('app')

      const esc = (s) =>
        String(s == null ? '' : s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' })[c])
      // Логотип — по сетке физических пикселей, иначе на масштабе 125–150% он мылится.
      const snapLogo = (function () {
        var el = document.querySelector('.brand-logo')
        if (!el) return
        el.style.transform = ''
        var r = el.getBoundingClientRect(), d = window.devicePixelRatio || 1, top = r.top + window.scrollY
        var dx = (Math.round(r.left * d) - r.left * d) / d, dy = (Math.round(top * d) - top * d) / d
        el.style.transform = dx || dy ? 'translate(' + dx + 'px, ' + dy + 'px)' : ''
      })
      window.addEventListener('resize', snapLogo)
      const dt = (s) => (s ? new Date(s).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }) : '—')

      // Колонки таблицы: ключ данных, заголовок, как показывать и как сортировать.
      const COLS = [
        { key: 'full', title: 'ФИО', cls: 'wrap', fmt: (v) => v || 'Без имени' },
        { key: 'login', title: 'Логин', cls: 'mono dim nowrap' },
        { key: 'group', title: 'Группа' },
        { key: 'specialty', title: 'Направление', cls: 'wrap' },
        { key: 'course', title: 'Курс', num: true, cls: 'nowrap' },
        { key: 'gender', title: 'Пол', cls: 'nowrap' },
        { key: 'birth', title: 'Рождение', cls: 'dim nowrap' },
        { key: 'curator', title: 'Куратор', cls: 'wrap' },
        { key: 'eduType', title: 'Тип' },
        { key: 'eduLang', title: 'Язык' },
        {
          key: 'gpa',
          title: 'GPA',
          num: true,
          cls: 'gpa nowrap',
          fmt: (v) => (v ? Number(v).toFixed(2) : '—'),
          clsOf: (v) => (!v ? '' : v >= 4.5 ? 'g-high' : v >= 3.5 ? 'g-mid' : v >= 2.6 ? 'g-norm' : 'g-low'),
          titleOf: (v) =>
            !v ? '' : v >= 4.5 ? 'Отлично' : v >= 3.5 ? 'Хорошо' : v >= 2.6 ? 'Нормально' : 'Критично',
        },
        { key: 'imports', title: 'Имп.', num: true, cls: 'dim nowrap' },
        { key: 'last', title: 'Визит', cls: 'dim', fmt: dt },
      ]

      // Фильтр каскадом: сначала поле, потом одно из значений, которые в нём встречаются.
      const FILTERS = [
        { key: 'specialty', label: 'Направление' },
        { key: 'course', label: 'Курс' },
        { key: 'gender', label: 'Пол' },
        { key: 'eduType', label: 'Тип обучения' },
        { key: 'eduLang', label: 'Язык обучения' },
        { key: 'group', label: 'Группа' },
        { key: 'curator', label: 'Куратор' },
      ]

      let rows = []
      let key = ''
      const state = { q: '', sort: 'last', dir: 'desc', field: '', value: '' }

      function gate(err) {
        app.innerHTML =
          '<div class="gate"><h1>Статистика</h1><p>Страница закрыта ключом доступа</p>' +
          '<input id="k" type="password" placeholder="ключ доступа" autofocus />' +
          '<button class="btn-accent" id="go">Открыть</button>' +
          '<div class="err">' + esc(err || '') + '</div></div>'
        const go = () => load(document.getElementById('k').value.trim())
        document.getElementById('go').onclick = go
        document.getElementById('k').onkeydown = (e) => { if (e.key === 'Enter') go() }
      }

      async function load(k) {
        if (!k) return gate('Введите ключ')
        app.innerHTML = '<div class="panel"><div class="empty">Загрузка…</div></div>'
        let res, data
        try {
          res = await fetch(API, { headers: { 'x-access-key': k } })
          data = await res.json()
        } catch {
          return gate('Сервер недоступен')
        }
        if (res.status === 401) {
          localStorage.removeItem(KEY_STORE)
          return gate('Неверный ключ')
        }
        if (!res.ok) return gate((data && data.error) || 'Ошибка ' + res.status)
        localStorage.setItem(KEY_STORE, k)
        key = k
        rows = data.students || []
        render()
      }

      const values = (field) =>
        [...new Set(rows.map((r) => (r[field] || '').trim()).filter(Boolean))].sort((a, b) =>
          a.localeCompare(b, 'ru', { numeric: true }),
        )

      function visible() {
        const q = state.q.trim().toLowerCase()
        let out = rows.filter((r) => {
          if (state.field && state.value && (r[state.field] || '').trim() !== state.value) return false
          if (!q) return true
          return COLS.some((c) => String(r[c.key] || '').toLowerCase().includes(q))
        })
        const col = COLS.find((c) => c.key === state.sort) || {}
        const sign = state.dir === 'asc' ? 1 : -1
        out = out.slice().sort((a, b) => {
          const x = a[state.sort]
          const y = b[state.sort]
          if (col.num) return sign * ((parseFloat(x) || 0) - (parseFloat(y) || 0))
          return sign * String(x || '').localeCompare(String(y || ''), 'ru', { numeric: true })
        })
        return out
      }

      // Сводка по тем, кто сейчас в таблице (с учётом поиска и фильтра).
      function statsHtml(list) {
        const today = new Date().toDateString()
        const week = Date.now() - 7 * 864e5
        const gpas = list.map((r) => Number(r.gpa)).filter((g) => g > 0)
        const avg = gpas.length ? gpas.reduce((a, b) => a + b, 0) / gpas.length : 0
        const band = !avg ? '' : avg >= 4.5 ? 'g-high' : avg >= 3.5 ? 'g-mid' : avg >= 2.6 ? 'g-norm' : 'g-low'
        const card = (value, label, cls) =>
          '<div class="stat"><b class="' + (cls || '') + '">' + value + '</b><span>' + label + '</span></div>'
        return (
          '<div class="stats">' +
          card(list.length, 'студентов') +
          card(list.reduce((n, r) => n + (Number(r.imports) || 0), 0), 'импортов') +
          card(avg ? avg.toFixed(2) : '—', 'средний GPA', band) +
          card(list.filter((r) => r.last && new Date(r.last).toDateString() === today).length, 'активны сегодня') +
          card(list.filter((r) => r.last && new Date(r.last).getTime() >= week).length, 'за 7 дней') +
          '</div>'
        )
      }

      function render() {
        const list = visible()
        const head = COLS.map((c) => {
          const on = state.sort === c.key
          const arrow = on ? (state.dir === 'asc' ? '▲' : '▼') : '▼'
          return '<th class="' + (on ? 'sorted ' : '') + (c.cls || '').replace(/mono|dim|gpa/g, '').trim() + '" data-sort="' + c.key + '">' +
            esc(c.title) + '<span class="arrow">' + arrow + '</span></th>'
        }).join('')

        const body = list
          .map(
            (r) =>
              '<tr>' +
              COLS.map((c) => {
                const val = c.fmt ? c.fmt(r[c.key]) : r[c.key]
                const cls = (c.cls || '') + (c.clsOf ? ' ' + c.clsOf(r[c.key]) : '')
                // Вычисленное по ФИО или учебному плану — с пометкой «≈».
                const guessed = val && (r.derived || []).includes(c.key)
                const title = guessed
                  ? ' title="Вычислено по ФИО или учебному плану, а не взято из LMS"'
                  : c.titleOf ? ' title="' + esc(c.titleOf(r[c.key])) + '"' : ''
                return '<td class="' + cls.trim() + '"' + title + '>' + (guessed ? '<span class="approx">≈</span>' : '') + esc(val || '—') + '</td>'
              }).join('') +
              '</tr>',
          )
          .join('')

        const fieldOpts = FILTERS.map(
          (f) => '<option value="' + f.key + '"' + (state.field === f.key ? ' selected' : '') + '>' + esc(f.label) + '</option>',
        ).join('')
        const valueOpts = state.field
          ? values(state.field)
              .map((v) => '<option value="' + esc(v) + '"' + (state.value === v ? ' selected' : '') + '>' + esc(v) + '</option>')
              .join('')
          : ''
        const filters =
          '<select id="field"><option value="">Фильтр: поле</option>' + fieldOpts + '</select>' +
          '<select id="value"' + (state.field ? '' : ' disabled') + '><option value="">' +
          (state.field ? 'все значения' : '—') + '</option>' + valueOpts + '</select>'

        app.innerHTML =
          '<div class="topbar"><div class="brand">' +
          '<img src="/logo-92.png" srcset="/logo-46.png 46w, /logo-52.png 52w, /logo-58.png 58w, /logo-65.png 65w, /logo-69.png 69w, /logo-78.png 78w, /logo-92.png 92w, /logo-104.png 104w, /logo-138.png 138w, /logo-156.png 156w" sizes="46px" width="46" height="46" alt="" class="brand-logo" />' +
          '<div class="brand-text"><span class="brand-name">GPA Calculator</span>' +
          '<span class="brand-tag">статистика импортов</span></div></div>' +
          '<div class="top-actions">' +
          '<button class="icon-btn" id="reload" title="Обновить" aria-label="Обновить">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
          '<polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" />' +
          '<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />' +
          '</svg></button>' +
          '<button id="out">Выйти</button></div></div>' +
          statsHtml(list) +
          '<div class="tools">' +
          '<input type="search" id="q" placeholder="Поиск по ФИО, логину, группе…" value="' + esc(state.q) + '" />' +
          filters +
          '<span class="count">' + list.length + ' из ' + rows.length + '</span>' +
          '<span class="legend"><span class="approx">≈</span> вычислено по ФИО или учебному плану</span></div>' +
          '<div class="panel"><div class="scroll">' +
          (rows.length
            ? '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>'
            : '<div class="empty">Пока никто не импортировал оценки.</div>') +
          (rows.length && !list.length ? '<div class="empty">Ничего не найдено.</div>' : '') +
          '</div></div>'

        const q = document.getElementById('q')
        q.oninput = () => {
          state.q = q.value
          render()
          const el = document.getElementById('q')
          el.focus()
          el.setSelectionRange(el.value.length, el.value.length)
        }
        document.getElementById('field').onchange = (e) => {
          state.field = e.target.value
          state.value = ''
          render()
        }
        document.getElementById('value').onchange = (e) => {
          state.value = e.target.value
          render()
        }
        app.querySelectorAll('[data-sort]').forEach((th) => {
          th.onclick = () => {
            const k = th.dataset.sort
            if (state.sort === k) state.dir = state.dir === 'asc' ? 'desc' : 'asc'
            else {
              state.sort = k
              state.dir = 'asc'
            }
            render()
          }
        })
        snapLogo()
        document.getElementById('reload').onclick = () => load(key)
        document.getElementById('out').onclick = () => {
          localStorage.removeItem(KEY_STORE)
          gate('')
        }
      }

      const saved = localStorage.getItem(KEY_STORE)
      if (saved) load(saved)
      else gate('')
    </script>
  </body>
</html>
